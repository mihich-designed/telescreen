[project]
name = "telescreen"
version = "0.1.0"
description = "Big Brother is watching your WAL. Lightweight PostgreSQL change data capture to Kafka and NATS."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "aiokafka>=0.12",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "dishka>=1.4",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.17",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn>=0.32",
]

[project.scripts]
telescreen-worker = "telescreen.bootstrap.worker:main"
telescreen-web = "telescreen.bootstrap.web:main"
telescreen-import = "telescreen.bootstrap.importer:main"

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.32.0",
    "httpx>=0.28",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-psycopg2>=2.9.21.20261008",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telescreen"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["telescreen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
markers = ["integration: needs a running PostgreSQL (see README)"]

[[tool.mypy.overrides]]
module = ["aiokafka", "aiokafka.*"]
ignore_missing_imports = true
